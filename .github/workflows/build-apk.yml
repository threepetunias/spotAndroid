name: Build Spot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_bundle:
        description: 'Also build the signed release bundle (.aab) for Google Play'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Spot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Signed release bundle for Google Play. Run it by hand: Actions, Build Spot APK, Run workflow, tick the box.
  # It needs four repository secrets (Settings, Secrets and variables, Actions):
  #   SPOT_UPLOAD_KEYSTORE_BASE64   the private upload keystore, as base64 text
  #   SPOT_UPLOAD_STORE_PASSWORD    the keystore password
  #   SPOT_UPLOAD_KEY_ALIAS         the key alias
  #   SPOT_UPLOAD_KEY_PASSWORD      the key password
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Check the upload key secrets are set
        env:
          SPOT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SPOT_UPLOAD_KEYSTORE_BASE64 }}
          SPOT_UPLOAD_STORE_PASSWORD: ${{ secrets.SPOT_UPLOAD_STORE_PASSWORD }}
          SPOT_UPLOAD_KEY_ALIAS: ${{ secrets.SPOT_UPLOAD_KEY_ALIAS }}
          SPOT_UPLOAD_KEY_PASSWORD: ${{ secrets.SPOT_UPLOAD_KEY_PASSWORD }}
        run: |
          for v in SPOT_UPLOAD_KEYSTORE_BASE64 SPOT_UPLOAD_STORE_PASSWORD SPOT_UPLOAD_KEY_ALIAS SPOT_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v"; exit 1; fi
          done
      - name: Build the signed release bundle
        env:
          SPOT_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SPOT_UPLOAD_KEYSTORE_BASE64 }}
          SPOT_UPLOAD_KEYSTORE: ${{ runner.temp }}/spot-upload.jks
          SPOT_UPLOAD_STORE_PASSWORD: ${{ secrets.SPOT_UPLOAD_STORE_PASSWORD }}
          SPOT_UPLOAD_KEY_ALIAS: ${{ secrets.SPOT_UPLOAD_KEY_ALIAS }}
          SPOT_UPLOAD_KEY_PASSWORD: ${{ secrets.SPOT_UPLOAD_KEY_PASSWORD }}
        run: |
          printf '%s' "$SPOT_UPLOAD_KEYSTORE_BASE64" | tr -d ' \r\n\t"' | base64 -d > "$SPOT_UPLOAD_KEYSTORE" || { echo "::error::The SPOT_UPLOAD_KEYSTORE_BASE64 secret is not valid base64 text. Re-copy the whole contents of the key text file into it."; exit 1; }
          [ -s "$SPOT_UPLOAD_KEYSTORE" ] || { echo "::error::The keystore came out empty."; exit 1; }
          chmod +x gradlew && ./gradlew bundleRelease --stacktrace
      - name: Remove the key from the runner
        if: always()
        run: rm -f "${{ runner.temp }}/spot-upload.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Spot-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
